  :root{
    --verde: #7FB536;
    --verde-oscuro: #527523;
    --tinta: #000000;
    --gris: #6b7570;
    --gris-claro: #e9ede8;
    --fondo: #f6f8f5;
    --tarjeta: #ffffff;
    --rojo: #A6005B;
    --ambar: #F59C2F;
    --magenta: #E6007E;
    --borde: #dbe2d8;
    --radio: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  button, input, textarea, select{
    font-family: inherit;
  }
  body{
    background:var(--fondo);
    color:var(--tinta);
    font-family: 'Brown', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding-bottom:40px;
    -webkit-tap-highlight-color: transparent;
  }
  header{
    background: var(--tinta);
    color:#fff;
    padding:18px 20px 16px;
    position:sticky; top:0; z-index:10;
  }
  header .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color: var(--verde);
    font-weight:700;
    margin-bottom:4px;
  }
  header h1{
    margin:0;
    font-size:19px;
    font-weight:700;
  }
  .estado-conexion{
    display:flex; align-items:center; gap:6px;
    font-size:12px; margin-top:10px; color:#c9d1c7;
  }
  .punto{
    width:8px;height:8px;border-radius:50%;
    background:var(--verde);
  }
  .punto.offline{background:var(--rojo);}
  main{
    max-width:520px;
    margin:0 auto;
    padding:18px 16px 0;
  }
  .tarjeta{
    background:var(--tarjeta);
    border:1.5px solid var(--magenta);
    border-radius:var(--radio);
    padding:18px;
    margin-bottom:16px;
  }
  .tarjeta h2{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--gris);
    margin:0 0 14px;
    font-weight:700;
  }
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    margin-bottom:6px;
    color:var(--tinta);
  }
  .campo{margin-bottom:16px;}
  .campo:last-child{margin-bottom:0;}
  input[type="text"], textarea, select{
    width:100%;
    padding:12px 13px;
    border:1.5px solid var(--borde);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    background:#fcfdfb;
    color:var(--tinta);
  }
  input[type="text"]:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--verde);
  }
  textarea{resize:vertical; min-height:70px;}

  .dispositivo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid var(--gris-claro);
    gap:12px;
  }
  .dispositivo:last-child{border-bottom:none;}
  .dispositivo-nombre{font-size:14.5px; font-weight:600;}
  .segmentado{
    display:flex;
    border:1.5px solid var(--borde);
    border-radius:10px;
    overflow:hidden;
    flex-shrink:0;
  }
  .segmentado button{
    border:none;
    background:#fff;
    padding:9px 12px;
    font-size:12.5px;
    font-weight:600;
    color:var(--gris);
    cursor:pointer;
    border-right:1px solid var(--borde);
    white-space:nowrap;
  }
  .segmentado button:last-child{border-right:none;}
  .segmentado button.activo-ok{background:var(--verde); color:#fff;}
  .segmentado button.activo-falla{background:var(--rojo); color:#fff;}
  .segmentado button.activo-na{background:var(--gris); color:#fff;}

  .toggle-aseo{
    display:flex;
    border:1.5px solid var(--borde);
    border-radius:10px;
    overflow:hidden;
  }
  .toggle-aseo button{
    flex:1;
    border:none;
    background:#fff;
    padding:12px;
    font-size:14px;
    font-weight:700;
    color:var(--gris);
    cursor:pointer;
  }
  .toggle-aseo button:first-child{border-right:1px solid var(--borde);}
  .toggle-aseo button.si.activo{background:var(--verde); color:#fff;}
  .toggle-aseo button.no.activo{background:var(--rojo); color:#fff;}

  .zona-foto{
    border:2px dashed var(--borde);
    border-radius:12px;
    padding:20px;
    text-align:center;
    background:#fbfcfa;
  }
  .zona-foto img{
    max-width:100%;
    border-radius:10px;
    display:block;
    margin:0 auto 12px;
  }
  .boton-foto{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--tinta);
    color:#fff;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .boton-foto svg{width:18px;height:18px;}
  .quitar-foto{
    display:block;
    margin:10px auto 0;
    background:none;
    border:none;
    color:var(--rojo);
    font-size:13px;
    font-weight:600;
    text-decoration:underline;
    cursor:pointer;
  }

  .btn-guardar{
    width:100%;
    background:var(--verde);
    color:#fff;
    border:none;
    padding:16px;
    border-radius:12px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(127,181,54,0.35);
  }
  .btn-guardar:active{background:var(--verde-oscuro);}
  .btn-guardar:disabled{background:var(--gris); box-shadow:none;}

  .mensaje{
    text-align:center;
    font-size:13px;

<body>

<header>
  <div class="eyebrow">Areandina · Recursos Audiovisuales</div>
  <h1>Verificación de Salones</h1>
  <div class="estado-conexion">
    <span class="punto" id="puntoConexion"></span>
    <span id="textoConexion">Conectado</span>
    <span id="contadorPendientes" style="margin-left:auto;"></span>
  </div>
</header>

<main>

  <form id="formulario">
    <div class="tarjeta">
      <h2>Datos generales</h2>
      <div class="campo">
        <label for="salon">Salón</label>
        <input type="text" id="salon" list="listaSalones" placeholder="Escribe o elige un salón" required autocomplete="off">
        <datalist id="listaSalones"></datalist>
      </div>
      <div class="campo">
        <label>Foto — antes de la visita</label>
        <div class="zona-foto" id="zonaFotoAntes"></div>
      </div>
      <div class="campo">
        <label for="encargado">Encargado de la verificación</label>
        <input type="text" id="encargado" placeholder="Tu nombre" required>
      </div>
      <div class="campo" style="margin-bottom:0;">
        <label>¿Se realizó el aseo de la pantalla?</label>
        <div class="toggle-aseo">
          <button type="button" class="si" data-valor="Sí">Sí</button>
          <button type="button" class="no" data-valor="No">No</button>
        </div>
      </div>
    </div>

    <div class="tarjeta">
      <h2>Estado de dispositivos</h2>
      <div id="listaDispositivos"></div>
      <div id="listaDispositivosExtra"></div>
      <button type="button" class="btn-agregar-dispositivo" id="btnMostrarFormExtra">+ Agregar otro dispositivo</button>
      <div id="formExtraContenedor"></div>
    </div>

    <div class="tarjeta">
      <h2>Observaciones</h2>
      <div class="campo" style="margin-bottom:0;">
        <textarea id="observaciones" placeholder="Detalles adicionales, otros dispositivos revisados, novedades..."></textarea>
      </div>
    </div>

    <div class="tarjeta">
      <h2>Foto de evidencia — después</h2>
      <div class="campo" style="margin-bottom:0;">
        <div class="zona-foto" id="zonaFotoDespues"></div>
      </div>
    </div>

    <div class="tarjeta">
      <h2>Fotos extra</h2>
      <p style="font-size:12.5px; color:var(--gris); margin:-6px 0 12px;">Úsalas si otra prueba requiere mostrar algo adicional.</p>
      <div id="listaFotosExtra"></div>
      <button type="button" class="btn-agregar-dispositivo" id="btnAgregarFotoExtra">+ Agregar foto extra</button>
      <input type="file" id="inputFotoExtra" accept="image/*" capture="environment" style="display:none;">
    </div>

    <button type="submit" class="btn-guardar" id="btnGuardar">Guardar registro</button>
    <div class="mensaje" id="mensaje"></div>
  </form>

  <div class="tarjeta" style="margin-top:24px;">
    <h2>Registros recientes en este dispositivo</h2>
    <div id="historial"></div>
  </div>

</main>

<script>
  // ============================================================
  // CONFIGURACIÓN: pega aquí la URL de tu implementación de
  // Google Apps Script (ver Codigo_AppsScript.gs para instrucciones).
  // ============================================================
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxx_pcLCgA238sUcJoWCqwKrj22Eyoeu2nt1K7TaTWwsWQmZgzB4f4Br8TI-nF0ufItzQ/exec';

  // Lista de dispositivos a verificar. Para agregar uno nuevo,
  // solo añade un elemento aquí: { id: 'clave', nombre: 'Texto visible' }
  // Lista cerrada de salones. Para agregar, quitar o renombrar uno,
  // solo edita este arreglo.
  const SALONES = [
    'VA208', 'VA203', 'VA204', 'VA205', 'VA206', 'VA209', 'VA210', 'VA215',
    'VA216', 'VA217', 'VA218', 'VB219', 'VB220', 'VB221', 'VB222', 'VB223',
    'VB224', 'VB225', 'VA305', 'VA307', 'VA309', 'VA316', 'VA319', 'VB320',
    'VB321', 'VB322', 'VB323', 'VB324', 'VB325', 'VB326', 'VB327', 'VB501',
    'VB502', 'VB503', 'VB504', 'VB505', 'VB506', 'VB507', 'VB508', 'VB509',
    'VB510', 'VB511', 'VB512', 'VB513', 'VB514', 'VB515', 'VB703', 'VB702',
    'VB701', 'AU_COLAB 7', 'VB603', 'VB602', 'VB601', 'AU_COLAB 6'
  ];
  const listaSalones = document.getElementById('listaSalones');
  SALONES.forEach(nombre => {
    const opcion = document.createElement('option');
    opcion.value = nombre;
    listaSalones.appendChild(opcion);
  });

  const DISPOSITIVOS = [
    { id: 'camara',   nombre: 'Cámara' },
    { id: 'red',      nombre: 'Punto de red' },
    { id: 'hdmi',     nombre: 'HDMI' },
    { id: 'pantalla', nombre: 'Pantalla / TV' },
  ];

  const ESTADOS = [
    { valor: 'Funciona',    etiqueta: 'Funciona', clase: 'activo-ok' },
    { valor: 'No funciona', etiqueta: 'Falla',     clase: 'activo-falla' },
    { valor: 'N/A',         etiqueta: 'N/A',       clase: 'activo-na' },
  ];

  const estadoDispositivos = {};
  let aseoRealizado = '';
  let fotoAntesBase64 = '';
  let fotoDespuesBase64 = '';
  let fotoAntesMomento = null;
  let fotoDespuesMomento = null;
  let dispositivosExtra = []; // { id, nombre, estado }
  let contadorExtra = 0;
  let fotosExtra = []; // { id, base64 }
  let contadorFotoExtra = 0;

  // ---------- Construir checklist ----------
  const listaEl = document.getElementById('listaDispositivos');
  DISPOSITIVOS.forEach(d => {
    const fila = document.createElement('div');
    fila.className = 'dispositivo';
    const nombre = document.createElement('div');
    nombre.className = 'dispositivo-nombre';
    nombre.textContent = d.nombre;
    const seg = document.createElement('div');
    seg.className = 'segmentado';
    ESTADOS.forEach(e => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = e.etiqueta;
      btn.addEventListener('click', () => {
        estadoDispositivos[d.id] = e.valor;
        [...seg.children].forEach(b => b.className = '');
        btn.className = e.clase;
      });
      seg.appendChild(btn);
    });
    fila.appendChild(nombre);
    fila.appendChild(seg);
    listaEl.appendChild(fila);
  });

  // ---------- Dispositivos personalizados (agregados por el usuario) ----------
  const listaExtraEl = document.getElementById('listaDispositivosExtra');
  const formExtraContenedor = document.getElementById('formExtraContenedor');
  const btnMostrarFormExtra = document.getElementById('btnMostrarFormExtra');

  function renderDispositivosExtra() {
    listaExtraEl.innerHTML = '';
    dispositivosExtra.forEach(item => {
      const fila = document.createElement('div');
      fila.className = 'dispositivo-extra';

      const linea = document.createElement('div');
      linea.className = 'dispositivo-extra-linea';

      const nombre = document.createElement('div');
      nombre.className = 'dispositivo-nombre';
      nombre.textContent = item.nombre;

      const seg = document.createElement('div');
      seg.className = 'segmentado';
      ESTADOS.forEach(e => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = e.etiqueta;
        if (item.estado === e.valor) btn.className = e.clase;
        btn.addEventListener('click', () => {
          item.estado = e.valor;
          [...seg.children].forEach(b => b.className = '');
          btn.className = e.clase;
        });
        seg.appendChild(btn);
      });

      const btnQuitar = document.createElement('button');
      btnQuitar.type = 'button';
      btnQuitar.className = 'quitar-extra';
      btnQuitar.innerHTML = '&times;';
      btnQuitar.title = 'Quitar dispositivo';
      btnQuitar.addEventListener('click', () => {
        dispositivosExtra = dispositivosExtra.filter(d => d.id !== item.id);
        renderDispositivosExtra();
      });

      linea.appendChild(nombre);
      linea.appendChild(seg);
      fila.appendChild(linea);
      fila.appendChild(btnQuitar);
      listaExtraEl.appendChild(fila);
    });
  }

  function mostrarFormExtra() {
    formExtraContenedor.innerHTML = `
      <div class="form-extra">
        <input type="text" id="inputNombreExtra" placeholder="Nombre del dispositivo (ej: Proyector)">
        <div class="form-extra-botones">
          <button type="button" class="btn-cancelar-extra" id="btnCancelarExtra">Cancelar</button>
          <button type="button" class="btn-confirmar-extra" id="btnConfirmarExtra">Agregar</button>
        </div>
      </div>
    `;
    const input = document.getElementById('inputNombreExtra');
    input.focus();
    document.getElementById('btnCancelarExtra').addEventListener('click', () => {
      formExtraContenedor.innerHTML = '';
    });
    document.getElementById('btnConfirmarExtra').addEventListener('click', () => {
      const nombre = input.value.trim();
      if (!nombre) { input.focus(); return; }
      contadorExtra += 1;
      dispositivosExtra.push({ id: 'extra_' + contadorExtra, nombre, estado: '' });
      renderDispositivosExtra();
      formExtraContenedor.innerHTML = '';
    });
  }
  btnMostrarFormExtra.addEventListener('click', mostrarFormExtra);

  // ---------- Toggle aseo ----------
  document.querySelectorAll('.toggle-aseo button').forEach(btn => {
    btn.addEventListener('click', () => {
      aseoRealizado = btn.dataset.valor;
      document.querySelectorAll('.toggle-aseo button').forEach(b => b.classList.remove('activo'));
      btn.classList.add('activo');
    });
  });

  // ---------- Fotos (antes / después) ----------
  function iconoCamaraSVG() {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
  }

  // Dibuja la imagen en un canvas, la redimensiona (máx 1600px de ancho)
  // y estampa la fecha y hora actuales como marca de agua en la esquina
  // inferior derecha, quemada directamente en los píxeles de la foto.
  function estamparFechaHora(dataUrlOriginal) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const ANCHO_MAX = 1280;
        const escala = img.width > ANCHO_MAX ? ANCHO_MAX / img.width : 1;
        const ancho = Math.round(img.width * escala);
        const alto = Math.round(img.height * escala);

        const canvas = document.createElement('canvas');
        canvas.width = ancho;
        canvas.height = alto;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, ancho, alto);

        const texto = new Date().toLocaleString('es-CO', {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        });

        const tamanoFuente = Math.max(14, Math.round(ancho * 0.032));
        ctx.font = `600 ${tamanoFuente}px -apple-system, Arial, sans-serif`;
        const anchoTexto = ctx.measureText(texto).width;
        const relleno = Math.round(tamanoFuente * 0.6);
        const cajaAncho = anchoTexto + relleno * 2;
        const cajaAlto = tamanoFuente + relleno * 1.6;
        const cajaX = ancho - cajaAncho - 14;
        const cajaY = alto - cajaAlto - 14;

        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(cajaX, cajaY, cajaAncho, cajaAlto);

        ctx.fillStyle = '#ffffff';
        ctx.textBaseline = 'middle';
        ctx.fillText(texto, cajaX + relleno, cajaY + cajaAlto / 2);

        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = dataUrlOriginal;
    });
  }

  function crearManejadorFoto(zonaId, onCambio, onVacio) {
    const zona = document.getElementById(zonaId);

    function mostrarVacia() {
      zona.innerHTML = `
        <input type="file" accept="image/*" capture="environment" style="display:none;">
        <button type="button" class="boton-foto">
          ${iconoCamaraSVG()}
          Tomar foto
        </button>
      `;
      const input = zona.querySelector('input[type="file"]');
      const boton = zona.querySelector('.boton-foto');
      boton.addEventListener('click', () => input.click());
      input.addEventListener('change', manejarCambio);
      if (onVacio) onVacio();
    }

    async function manejarCambio(ev) {
      const archivo = ev.target.files[0];
      if (!archivo) return;
      const lector = new FileReader();
      lector.onload = async () => {
        const boton = zona.querySelector('.boton-foto');
        if (boton) { boton.disabled = true; boton.textContent = 'Procesando...'; }
        try {
          const conMarca = await estamparFechaHora(lector.result);
          zona.innerHTML = `
            <img src="${conMarca}" alt="Foto de evidencia con fecha y hora">
            <button type="button" class="quitar-foto">Quitar y repetir</button>
          `;
          zona.querySelector('.quitar-foto').addEventListener('click', mostrarVacia);
          onCambio(conMarca);
        } catch (err) {
          // Si algo falla al estampar, se usa la foto original sin marca.
          const resultado = lector.result;
          zona.innerHTML = `
            <img src="${resultado}" alt="Foto de evidencia">
            <button type="button" class="quitar-foto">Quitar y repetir</button>
          `;
          zona.querySelector('.quitar-foto').addEventListener('click', mostrarVacia);
          onCambio(resultado);
        }
      };
      lector.readAsDataURL(archivo);
    }

    mostrarVacia();
    return { reiniciar: mostrarVacia };
  }

  const fotoAntes = crearManejadorFoto('zonaFotoAntes',
    (valor) => { fotoAntesBase64 = valor; fotoAntesMomento = Date.now(); },
    () => { fotoAntesBase64 = ''; fotoAntesMomento = null; }
  );
  const fotoDespues = crearManejadorFoto('zonaFotoDespues',
    (valor) => { fotoDespuesBase64 = valor; fotoDespuesMomento = Date.now(); },
    () => { fotoDespuesBase64 = ''; fotoDespuesMomento = null; }
  );

  // Calcula cuánto pasó entre la foto de "antes" y la de "después".
  // Devuelve un texto legible (ej: "8 min 12 s") y los segundos totales.
  function calcularTiempoEntreFotos() {
    if (!fotoAntesMomento || !fotoDespuesMomento) {
      return { texto: '', segundos: '' };
    }
    const diffMs = Math.max(0, fotoDespuesMomento - fotoAntesMomento);
    const totalSegundos = Math.round(diffMs / 1000);
    const horas = Math.floor(totalSegundos / 3600);
    const minutos = Math.floor((totalSegundos % 3600) / 60);
    const segundos = totalSegundos % 60;
    let texto = '';
    if (horas > 0) texto += `${horas} h `;
    if (minutos > 0 || horas > 0) texto += `${minutos} min `;
    texto += `${segundos} s`;
    return { texto: texto.trim(), segundos: totalSegundos };
  }

  // ---------- Fotos extra ----------
  const listaFotosExtraEl = document.getElementById('listaFotosExtra');
  const btnAgregarFotoExtra = document.getElementById('btnAgregarFotoExtra');
  const inputFotoExtra = document.getElementById('inputFotoExtra');

  function renderFotosExtra() {
    listaFotosExtraEl.innerHTML = '';
    if (fotosExtra.length === 0) return;
    const grid = document.createElement('div');
    grid.className = 'fotos-extra-grid';
    fotosExtra.forEach(item => {
      const celda = document.createElement('div');
      celda.className = 'foto-extra-item';
      celda.innerHTML = `
        <img src="${item.base64}" alt="Foto extra">
        <button type="button" title="Quitar">&times;</button>
      `;
      celda.querySelector('button').addEventListener('click', () => {
        fotosExtra = fotosExtra.filter(f => f.id !== item.id);
        renderFotosExtra();
      });
      grid.appendChild(celda);
    });
    listaFotosExtraEl.appendChild(grid);
  }

  btnAgregarFotoExtra.addEventListener('click', () => inputFotoExtra.click());

  inputFotoExtra.addEventListener('change', async (ev) => {
    const archivo = ev.target.files[0];
    if (!archivo) return;
    const textoOriginal = btnAgregarFotoExtra.textContent;
    btnAgregarFotoExtra.disabled = true;
    btnAgregarFotoExtra.textContent = 'Procesando...';
    const lector = new FileReader();
    lector.onload = async () => {
      try {
        const conMarca = await estamparFechaHora(lector.result);
        contadorFotoExtra += 1;
        fotosExtra.push({ id: 'foto_extra_' + contadorFotoExtra, base64: conMarca });
      } catch (err) {
        contadorFotoExtra += 1;
        fotosExtra.push({ id: 'foto_extra_' + contadorFotoExtra, base64: lector.result });
      }
      renderFotosExtra();
      inputFotoExtra.value = '';
      btnAgregarFotoExtra.disabled = false;
      btnAgregarFotoExtra.textContent = textoOriginal;
    };
    lector.readAsDataURL(archivo);
  });

  // ---------- Cola offline (localStorage) ----------
  const CLAVE_COLA = 'verificacion_salones_cola';

  function leerCola() {
    try { return JSON.parse(localStorage.getItem(CLAVE_COLA)) || []; }
    catch { return []; }
  }
  // Devuelve true si logró guardar, false si no había espacio suficiente.
  function guardarCola(cola) {
    try {
      localStorage.setItem(CLAVE_COLA, JSON.stringify(cola));
      return true;
    } catch (err) {
      return false;
    }
  }

  const TIEMPO_LIMITE_ENVIO_MS = 60000;

  async function enviarRegistro(registro) {
    if (APPS_SCRIPT_URL.includes('PEGA_AQUI')) {
      throw new Error('Falta configurar la URL de Apps Script en el código.');
    }
    const control = new AbortController();
    const limite = setTimeout(() => control.abort(), TIEMPO_LIMITE_ENVIO_MS);
    try {
      // No usamos 'cors' + leer la respuesta: en algunos celulares (sobre
      // todo iPhone) el navegador se queda esperando esa respuesta aunque
      // Apps Script ya haya terminado de guardar todo correctamente.
      // Con 'no-cors' el envío llega igual, y si no hay error de red
      // (sin conexión, dominio bloqueado, tiempo agotado) lo damos por
      // entregado — que es justamente lo que confirma la hoja de cálculo.
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(registro),
        signal: control.signal
      });
      return { ok: true };
    } finally {
      clearTimeout(limite);
    }
  }

  async function sincronizarCola() {
    if (!navigator.onLine) return;
    let cola = leerCola();
    if (cola.length === 0) return actualizarEstadoConexion();
    const restantes = [];
    for (const registro of cola) {
      try {
        await enviarRegistro(registro);
      } catch (err) {
        restantes.push(registro);
      }
    }
    guardarCola(restantes);
    renderHistorial();
    actualizarEstadoConexion();
  }

  // Guarda un valor en localStorage sin lanzar excepción si no hay espacio.
  function guardarEnLocalStorage(clave, valor) {
    try {
      localStorage.setItem(clave, JSON.stringify(valor));
      return true;
    } catch (err) {
      return false;
    }
  }

  // Quita las fotos (pesadas) de un registro antes de guardarlo como
  // historial local, para no llenar el almacenamiento del navegador.
  function sinFotos(registro) {
    const { foto_antes, foto_despues, fotos_extra, ...resto } = registro;
    return resto;
  }

  // ---------- Estado de conexión ----------
  function actualizarEstadoConexion() {
    const punto = document.getElementById('puntoConexion');
    const texto = document.getElementById('textoConexion');
    const contador = document.getElementById('contadorPendientes');
    const online = navigator.onLine;
    punto.classList.toggle('offline', !online);
    texto.textContent = online ? 'Conectado' : 'Sin conexión — se guardará localmente';
    const pendientes = leerCola().length;
    contador.textContent = pendientes > 0 ? `${pendientes} pendiente(s)` : '';
  }
  window.addEventListener('online', sincronizarCola);
  window.addEventListener('offline', actualizarEstadoConexion);

  // ---------- Historial local ----------
  function renderHistorial() {
    const cont = document.getElementById('historial');
    const cola = leerCola();
    const enviados = JSON.parse(localStorage.getItem('verificacion_salones_enviados') || '[]');
    const todos = [...cola.map(r => ({...r, _estado: 'pendiente'})), ...enviados.map(r => ({...r, _estado: 'enviado'}))]
      .sort((a, b) => new Date(b._fecha) - new Date(a._fecha))
      .slice(0, 15);

    if (todos.length === 0) {
      cont.innerHTML = '<div class="vacio">Todavía no hay registros en este dispositivo.</div>';
      return;
    }
    cont.innerHTML = todos.map(r => `
      <div class="historial-item">
        <div class="historial-info">
          <b>${r.salon || 'Sin salón'}</b>
          <span>${r._fecha ? new Date(r._fecha).toLocaleString('es-CO') : ''} · ${r.encargado || ''}</span>
        </div>
        <span class="chip ${r._estado}">${r._estado === 'pendiente' ? 'Pendiente' : 'Enviado'}</span>
      </div>
    `).join('');
  }

  // ---------- Envío del formulario ----------
  const formulario = document.getElementById('formulario');
  const btnGuardar = document.getElementById('btnGuardar');
  const mensaje = document.getElementById('mensaje');

  formulario.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    mensaje.textContent = '';
    mensaje.className = 'mensaje';

    const salon = document.getElementById('salon').value.trim();
    const encargado = document.getElementById('encargado').value.trim();

    if (!salon || !encargado) {
      mensaje.textContent = 'Completa el salón y el encargado.';
      mensaje.className = 'mensaje error';
      return;
    }
    if (!fotoAntesBase64 || !fotoDespuesBase64) {
      mensaje.textContent = 'Debes tomar la foto de antes y la de después.';
      mensaje.className = 'mensaje error';
      return;
    }
    if (!aseoRealizado) {
      mensaje.textContent = 'Indica si se realizó el aseo.';
      mensaje.className = 'mensaje error';
      return;
    }

    const otrosDispositivosTexto = dispositivosExtra
      .map(d => `${d.nombre}: ${d.estado || 'Sin marcar'}`)
      .join(' | ');

    const tiempoEntreFotos = calcularTiempoEntreFotos();

    const registro = {
      _id: 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 10),
      _fecha: new Date().toISOString(),
      salon,
      encargado,
      aseo: aseoRealizado,
      camara: estadoDispositivos['camara'] || 'N/A',
      red: estadoDispositivos['red'] || 'N/A',
      hdmi: estadoDispositivos['hdmi'] || 'N/A',
      pantalla: estadoDispositivos['pantalla'] || 'N/A',
      otros_dispositivos: otrosDispositivosTexto,
      observaciones: document.getElementById('observaciones').value.trim(),
      foto_antes: fotoAntesBase64,
      foto_despues: fotoDespuesBase64,
      fotos_extra: fotosExtra.map(f => f.base64),
      tiempo_entre_fotos: tiempoEntreFotos.texto,
      tiempo_entre_fotos_segundos: tiempoEntreFotos.segundos
    };

    btnGuardar.disabled = true;
    btnGuardar.textContent = 'Guardando...';

    try {
      if (navigator.onLine) {
        await enviarRegistro(registro);
        const enviados = JSON.parse(localStorage.getItem('verificacion_salones_enviados') || '[]')
          .map(sinFotos); // limpia fotos de registros guardados antes de este cambio
        enviados.unshift(sinFotos(registro));
        guardarEnLocalStorage('verificacion_salones_enviados', enviados.slice(0, 50));
        mensaje.textContent = 'Registro guardado correctamente.';
        mensaje.className = 'mensaje ok';
      } else {
        throw new Error('offline');
      }
    } catch (err) {
      // Sin conexión, se agotó el tiempo de espera, o falló el envío:
      // se intenta guardar en la cola local para reintentar después.
      // (El registro lleva un ID único, así que si en realidad sí se
      // había guardado del lado del servidor, el reintento no duplica
      // la fila en el Sheet — el backend lo detecta y lo ignora.)
      const LIMITE_COLA = 8;
      const cola = leerCola();
      if (cola.length >= LIMITE_COLA) {
        mensaje.textContent = `Ya hay ${LIMITE_COLA} registros esperando para enviarse y no caben más en el celular. Busca señal, espera a que se envíen (revisa el punto de conexión arriba) y vuelve a intentar este registro.`;
        mensaje.className = 'mensaje error';
      } else {
        cola.push(registro);
        const seGuardoLocal = guardarCola(cola);
        if (!seGuardoLocal) {
          mensaje.textContent = 'No hay espacio suficiente en el celular para guardar el registro sin conexión. Es probable que ya se haya enviado bien — verifica el Excel. Si no aparece, busca señal e intenta de nuevo.';
          mensaje.className = 'mensaje error';
        } else {
          mensaje.textContent = err.name === 'AbortError'
            ? 'La conexión está muy lenta: es probable que igual se haya guardado bien (verifica el Excel). También quedó una copia local por si acaso.'
            : err.message === 'offline'
              ? 'Sin conexión: el registro quedó guardado y se enviará automáticamente.'
              : 'No se pudo enviar ahora. El registro quedó guardado y se reintentará.';
          mensaje.className = 'mensaje error';
        }
      }
    }

    formulario.reset();
    fotoAntes.reiniciar();
    fotoDespues.reiniciar();
    fotoAntesMomento = null;
    fotoDespuesMomento = null;
    document.querySelectorAll('.toggle-aseo button').forEach(b => b.classList.remove('activo'));
    document.querySelectorAll('#listaDispositivos .segmentado button').forEach(b => b.className = '');
    Object.keys(estadoDispositivos).forEach(k => delete estadoDispositivos[k]);
    aseoRealizado = '';
    dispositivosExtra = [];
    renderDispositivosExtra();
    fotosExtra = [];
    renderFotosExtra();

    btnGuardar.disabled = false;
    btnGuardar.textContent = 'Guardar registro';
    actualizarEstadoConexion();
    renderHistorial();
  });

  // ---------- Inicio ----------
  // Limpia fotos que hayan quedado guardadas en el historial en versiones
  // anteriores de la app, para liberar espacio del navegador.
  (function limpiarHistorialPesado() {
    try {
      const enviados = JSON.parse(localStorage.getItem('verificacion_salones_enviados') || '[]');
      const tieneFotos = enviados.some(r => r.foto_antes || r.foto_despues || (r.fotos_extra && r.fotos_extra.length));
      if (tieneFotos) {
        guardarEnLocalStorage('verificacion_salones_enviados', enviados.map(sinFotos));
      }
    } catch (err) { /* si el historial está corrupto, se ignora */ }
  })();

  actualizarEstadoConexion();
  renderHistorial();
  sincronizarCola();
  setInterval(sincronizarCola, 30000);
</script>

</body>
</html>
